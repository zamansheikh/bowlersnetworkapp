name: bowlersnetworkapp
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.4+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_bloc: ^9.1.1
  
  # Dependency Injection
  get_it: ^9.0.5
  injectable: ^2.6.0
  
  # Date formatting
  intl: ^0.20.2
  
  # Navigation
  go_router: ^17.0.0
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Media & Network
  video_player: ^2.10.1
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  visibility_detector: ^0.4.0+2
  
  # Network
  dio: ^5.9.0
  retrofit: ^4.9.0
  http: ^1.6.0
  
  # Local Storage
  shared_preferences: ^2.5.3
  
  # JSON Serialization
  json_annotation: ^4.9.0
  
  # Utils
  equatable: ^2.0.7
  url_launcher: ^6.3.2
  
  # Charts
  fl_chart: ^1.1.1

  # Calendar
  table_calendar: ^3.2.0
  flutter_svg: ^2.2.2
  
  # Responsive design
  flutter_screenutil: ^5.9.3

  # Maps
  mapbox_maps_flutter: ^2.18.0
  flutter_dotenv: ^6.0.0
  
  # OTP Input
  pinput: ^6.0.2
  
  # Toast Messages
  fluttertoast: ^9.0.0
  
  # Package Info
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.10.2
  injectable_generator: ^2.9.1
  json_serializable: ^6.11.1
  retrofit_generator: ^10.1.4
  package_rename: ^1.10.0


flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icon/
    - assets/icons/
    - assets/splash/
    - assets/navbar/
    - .env
    - assets/games/games.json

